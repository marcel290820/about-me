description: >-
  A bachelor thesis on predicting residential sale prices from a national
  real-estate dataset joined to socio-economic and demographic data.
  Gradient-boosted trees against a neural baseline, trained separately on the
  years around the crisis and the years without it, and read back with
  Shapley values rather than an error figure alone.
