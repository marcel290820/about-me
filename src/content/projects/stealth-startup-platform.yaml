description: >-
  Four Next.js apps on one Fastify backend, with Postgres holding the records
  and ClickHouse the analytics read off them. Collectors on their own boxes
  feed on-chain, market and social data in, deployed from the repo by Ansible
  so a machine is never edited by hand. I worked across all of it, front to
  back, from the query layer to the boxes.
